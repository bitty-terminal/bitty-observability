[workspace]
resolver = "2"
members = [
    "crates/bitty-observability-api",
    "crates/bitty-observability-core",
    "crates/bitty-observability",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty-observability"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
